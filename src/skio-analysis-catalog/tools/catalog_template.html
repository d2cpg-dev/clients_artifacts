<title>Skio Analysis Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky section rail on the left, one working pane on the right; rail becomes a scrolling tab strip on phones. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --ink:#161a21; --ink-2:#4c5563; --ink-3:#6f7885; --rule:#dde1e7;
  --accent:#0d6b6b; --accent-soft:#e2f0ef; --focus:#1f63c7;
  --s1:#2a78d6; --s1-soft:#cde2fb;
  --seq1:#eef4fc; --seq2:#b7d3f6; --seq3:#6da7ec; --seq4:#2a78d6; --seq5:#184f95;
  --good:#0ca30c; --warn:#b77900; --serious:#c9562b; --crit:#d03b3b;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d21; --surface-2:#23272d; --ink:#eef1f4; --ink-2:#b4bcc7; --ink-3:#8b94a0; --rule:#2e333a;
  --accent:#4fb7b1; --accent-soft:#17312f; --focus:#6aa6f5; --s1:#3987e5; --s1-soft:#1c3552;
  --seq1:#1b2430; --seq2:#1c4270; --seq3:#256abf; --seq4:#3987e5; --seq5:#86b6ef;
  --good:#3cc23c; --warn:#fab219; --serious:#ec835a; --crit:#e66767; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --surface-2:#23272d; --ink:#eef1f4; --ink-2:#b4bcc7; --ink-3:#8b94a0; --rule:#2e333a;
  --accent:#4fb7b1; --accent-soft:#17312f; --focus:#6aa6f5; --s1:#3987e5; --s1-soft:#1c3552;
  --seq1:#1b2430; --seq2:#1c4270; --seq3:#256abf; --seq4:#3987e5; --seq5:#86b6ef;
  --good:#3cc23c; --warn:#fab219; --serious:#ec835a; --crit:#e66767; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55;margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;padding:24px 16px;border-right:1px solid var(--rule);background:var(--surface)}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.15;letter-spacing:-.01em;margin:0 0 4px}
.brand-sub{font-size:12px;color:var(--ink-3);margin:0 0 20px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink-2);font-size:13.5px}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail button .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.rail-foot{margin-top:24px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
main{padding-block:28px 64px;padding-inline:clamp(16px,3vw,40px);min-width:0;max-width:1240px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;letter-spacing:-.01em;margin:0}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:21px;font-weight:700;margin-bottom:6px}
h3{font-size:16px;font-weight:700}
.lede{color:var(--ink-2);max-width:68ch;margin:8px 0 0}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
section.view{display:flex;flex-direction:column;gap:28px}
.block{display:flex;flex-direction:column;gap:12px}
.block-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.muted{color:var(--ink-3)}
.mono{font-family:var(--font-mono);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.link{cursor:pointer}
.card.link:hover{border-color:var(--accent)}
.rid{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);max-width:100%;overflow-wrap:anywhere}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.btn{cursor:pointer;border:0}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap}
.sev::before{content:"";width:9px;height:9px;border-radius:2px;background:currentColor}
.sev.high{color:var(--crit)} .sev.medium{color:var(--serious)} .sev.low{color:var(--ink-3)}
.sev.high::before{border-radius:50%}
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.wrap{min-width:220px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{width:min(320px,100%)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:12.5px;cursor:pointer;background:var(--surface);color:var(--ink-2);border:1px solid var(--rule);border-radius:6px;padding:5px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.heat td.cell{text-align:center;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:12px;min-width:44px}
.heat .l0{background:transparent;color:var(--ink-3)} .heat .l1{background:var(--seq1)} .heat .l2{background:var(--seq2)} .heat .l3{background:var(--seq3);color:#fff} .heat .l4{background:var(--seq4);color:#fff} .heat .l5{background:var(--seq5);color:#fff}
:root[data-theme="dark"] .heat .l5{color:#0b1b30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .heat .l5{color:#0b1b30}}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--s1)}
.legend-seq{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.legend-seq i{display:inline-block;width:22px;height:12px;border-radius:2px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono,h2,h3{overflow-wrap:anywhere}
.dossier-pick{display:flex;flex-wrap:wrap;gap:6px}
.dossier-pick button{max-width:100%;font:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;text-align:left;color:var(--ink)}
.dossier-pick button b{font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--accent);margin-right:6px}
.dossier-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ins{border-left:3px solid var(--rule);padding:6px 0 6px 12px}
.ins.risk{border-color:var(--crit)} .ins.finding{border-color:var(--s1)} .ins.opportunity{border-color:var(--good)} .ins.watch{border-color:var(--warn)}
.ins .t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--ink-3)}
.chartcard{display:flex;flex-direction:column;gap:10px}
.panels{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.panel{border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--bg);min-width:0}
.panel h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.panel svg{display:block;width:100%;height:auto;overflow:visible}
.hb{display:grid;grid-template-columns:minmax(80px,40%) minmax(0,1fr) max-content;gap:3px 8px;align-items:center;font-size:12px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb .trk{height:12px;position:relative}
.hb .bar{height:100%;background:var(--s1);border-radius:0 3px 3px 0;min-width:1px}
.hb .v{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
details{border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
details>summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--ink-2)}
details[open]>summary{border-bottom:1px solid var(--rule)}
details .tw{border:0;border-radius:0}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 8px;border-radius:6px;max-width:260px;z-index:20;line-height:1.35}
.bars3{display:flex;height:12px;border-radius:3px;overflow:hidden;gap:2px;min-width:120px}
.bars3 span{display:block;height:100%}
.pre{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;margin:0}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:75ch}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;max-width:80ch}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;padding:10px 16px;border-right:0;border-bottom:1px solid var(--rule)}
  .brand{font-size:16px;margin:0 0 6px} .brand-sub,.rail-foot{display:none}
  .rail nav{flex-direction:row;overflow-x:auto;gap:4px}
  .rail button{white-space:nowrap} .rail button .n{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="shell">
  <aside class="rail">
    <p class="brand">Skio Analysis Catalog</p>
    <p class="brand-sub">Reverse-engineered map of every metric, method and chart in the Skio analyses received</p>
    <nav id="nav" aria-label="Sections"></nav>
    <p class="rail-foot" id="railfoot"></p>
  </aside>
  <main id="main"></main>
</div>
<div id="tip" hidden></div>

<script>
const B = /*__BUNDLE__*/null;
const F = B.framework, R = B.reports, X = B.cross || {};
const MET = Object.fromEntries(F.metrics.map(m => [m.id, m]));
const DIM = Object.fromEntries(F.dimensions.map(d => [d.id, d]));
const CON = Object.fromEntries(F.concepts.map(c => [c.id, c]));
const PAT = Object.fromEntries(F.chart_patterns.map(p => [p.id, p]));
const UIP = Object.fromEntries(F.ui_patterns.map(p => [p.id, p]));
const DOM = Object.fromEntries(F.taxonomy.domains.map(d => [d.id, d]));
const ARC = Object.fromEntries((F.taxonomy.report_archetypes || []).map(a => [a.id, a]));
const RID = R.map(r => r.report_id);
const REP = Object.fromEntries(R.map(r => [r.report_id, r]));
const STORE = {}; (X.stores || []).forEach(s => s.reports.forEach(r => STORE[r] = s));

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (v, d) => Number(v).toLocaleString('en-US', {maximumFractionDigits: d ?? 2});
function fmt(v, unit){
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v !== 'number') return esc(v);
  switch(unit){
    case 'usd': return '$' + nf(v, Math.abs(v) >= 1000 ? 0 : 2);
    case 'pct': return nf(v, 2) + '%';
    case 'pp': return nf(v, 2) + ' pt';
    case 'multiple': return nf(v, 2) + '×';
    case 'days': return nf(v, 1) + ' d';
    default: return nf(v, 2);
  }
}
function fmtCompare(c){
  if (!c) return '';
  const parts = [];
  if (c.value !== undefined) parts.push('vs ' + esc(c.value));
  if (c.basis) parts.push(esc(c.basis));
  if (c.delta !== undefined) parts.push((c.delta > 0 ? '+' : '') + esc(c.delta) + (c.delta_unit === 'pct' ? '%' : c.delta_unit === 'pp' ? ' pt' : c.delta_unit === 'multiple' ? '×' : ''));
  return parts.join(' · ');
}
const sliceTxt = s => s ? Object.entries(s).map(([k, v]) => `<span class="chip">${esc((DIM[k]||{}).name || k)}: ${esc(v)}</span>`).join(' ') : '';
const sev = s => `<span class="sev ${s}">${s === 'high' ? 'High' : s === 'medium' ? 'Medium' : 'Low'}</span>`;
const rchip = id => `<button class="chip acc btn" data-go="${id}">${id}</button>`;

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; } tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false; });
document.addEventListener('mousemove', e => { if (tip.hidden) return; const w = tip.offsetWidth; tip.style.left = Math.min(e.clientX + 12, innerWidth - w - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });

/* ---------- mini charts: one series per panel, one axis ---------- */
function miniChart(labels, values, unitHint, forceH){
  const nums = values.map(v => typeof v === 'number' ? v : NaN);
  const valid = nums.filter(v => !isNaN(v));
  if (!valid.length) return '<p class="muted">No numeric values.</p>';
  const avgLen = labels.reduce((a, l) => a + String(l).length, 0) / labels.length;
  if ((forceH || avgLen > 11) && labels.length <= 18 && Math.min(...valid) >= 0){
    const mx = Math.max(...valid) || 1;
    return '<div class="hb">' + labels.map((l, i) => {
      const v = nums[i]; const w = isNaN(v) ? 0 : 100 * v / mx;
      return `<span class="lab" title="${esc(l)}">${esc(l)}</span><span class="trk"><span class="bar" style="width:${w}%" data-tip="${esc(l)}<br><b>${isNaN(v) ? '—' : fmt(v, unitHint)}</b>"></span></span><span class="v">${isNaN(v) ? '—' : fmt(v, unitHint)}</span>`;
    }).join('') + '</div>';
  }
  const W = 320, H = 130, pl = 40, pr = 6, pt = 8, pb = 22;
  let mn = Math.min(0, ...valid), mx = Math.max(0, ...valid); if (mx === mn) mx = mn + 1;
  const y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  const n = labels.length, step = (W - pl - pr) / n;
  const nice = v => Math.abs(v) >= 1e6 ? (v/1e6).toFixed(1) + 'M' : Math.abs(v) >= 1e3 ? (v/1e3).toFixed(Math.abs(v) >= 1e4 ? 0 : 1) + 'K' : (Math.round(v*10)/10).toString();
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="chart">`;
  [mn, (mn + mx) / 2, mx].forEach(t => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)" stroke-width="1"/><text x="${pl - 5}" y="${y(t) + 3.5}" text-anchor="end" font-size="9" fill="var(--ink-3)" font-family="var(--font-mono)">${nice(t)}</text>`; });
  const useLine = n > 16;
  if (useLine){
    const pts = nums.map((v, i) => isNaN(v) ? null : [pl + step * (i + .5), y(v)]);
    s += `<polyline fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" points="${pts.filter(Boolean).map(p => p.join(',')).join(' ')}"/>`;
    pts.forEach((p, i) => { if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="transparent" data-tip="${esc(labels[i])}<br><b>${fmt(nums[i], unitHint)}</b>"/>`; });
    const last = pts.filter(Boolean).pop(); if (last) s += `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
  } else {
    const bw = Math.max(2, step - 3);
    nums.forEach((v, i) => { if (isNaN(v)) return; const x = pl + step * i + (step - bw) / 2; const y0 = y(0), y1 = y(v);
      s += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="2" fill="${v < 0 ? 'var(--crit)' : 'var(--s1)'}" data-tip="${esc(labels[i])}<br><b>${fmt(v, unitHint)}</b>"/>`; });
  }
  const tickIdx = n <= 8 ? labels.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
  tickIdx.forEach(i => { const l = String(labels[i]); s += `<text x="${pl + step * (i + .5)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--ink-3)">${esc(l.length > 9 ? l.slice(0, 8) + '…' : l)}</text>`; });
  return s + '</svg>';
}
function unitFor(label, chart){
  const t = (label + ' ' + chart.y + ' ' + (chart.y2 || '')).toLowerCase();
  if (/rate|%|share|hazard|retention|cancelled \(/.test(label.toLowerCase())) return 'pct';
  if (/rev|mrr|\$|revenue/.test(label.toLowerCase())) return 'usd';
  if (/days/.test(label.toLowerCase())) return 'days';
  return /usd/.test(t) && !/count|sessions|subs/.test(label.toLowerCase()) ? 'usd' : 'count';
}
function chartCard(c, rid){
  const ds = c.data.datasets, maxP = 4;
  const wideH = c.pattern === 'viz.hbar_ranked' || (c.data.labels.reduce((a, l) => a + String(l).length, 0) / c.data.labels.length > 11 && c.data.labels.length <= 18);
  const panels = ds.slice(0, maxP).map(d => `<div class="panel"${wideH ? ' style="grid-column:1/-1"' : ''}><h4>${esc(d.label)}</h4>${miniChart(c.data.labels, d.values, unitFor(d.label, c), c.pattern === 'viz.hbar_ranked')}</div>`).join('');
  const more = ds.length > maxP ? `<p class="muted" style="margin:0">${ds.length - maxP} more series are in the data table.</p>` : '';
  const tbl = `<details><summary>Data table · ${c.data.labels.length} rows × ${ds.length} series</summary><div class="tw"><table><thead><tr><th>${esc(c.x.split(' ')[0])}</th>${ds.map(d => `<th class="num">${esc(d.label)}</th>`).join('')}</tr></thead><tbody>${c.data.labels.map((l, i) => `<tr><td>${esc(l)}</td>${ds.map(d => `<td class="num">${typeof d.values[i] === 'number' ? nf(d.values[i]) : esc(d.values[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  return `<article class="card chartcard" id="${c.chart_id}">
    <div class="block-head"><h3>${esc(c.title)}</h3><span class="chips"><span class="rid">${c.chart_id}</span><span class="chip">${esc((PAT[c.pattern]||{}).name || c.pattern)}</span><span class="chip">${esc(c.library)}</span></span></div>
    <dl class="kv"><dt>Question</dt><dd>${esc(c.question)}</dd><dt>X</dt><dd class="mono">${esc(c.x)}</dd><dt>Y</dt><dd class="mono">${esc(c.y)}</dd>${c.y2 ? `<dt>Second axis</dt><dd class="mono">${esc(c.y2)}</dd>` : ''}${c.notes ? `<dt>Notes</dt><dd>${esc(c.notes)}</dd>` : ''}</dl>
    <div class="panels">${panels}</div>${more}${tbl}</article>`;
}

/* ---------- views ---------- */
const views = [
  {id:'overview', name:'Overview'},
  {id:'coverage', name:'Coverage map'},
  {id:'reports', name:'Report dossiers', n: R.length},
  {id:'metrics', name:'Metric dictionary', n: F.metrics.length},
  {id:'compare', name:'Cross-report'},
  {id:'methods', name:'Methods & concepts', n: F.concepts.length},
  {id:'charts', name:'Chart gallery', n: B.stats.charts},
  {id:'quality', name:'Data-quality ledger', n: B.qa.length},
  {id:'gaps', name:'Skio native gaps'},
  {id:'template', name:'Add a report'}
];
const nav = document.getElementById('nav'), main = document.getElementById('main');

template(){

      <li>Fill the profile and build blocks, then list sections in page order with the question each answers.</li>
      <li>Record every number as a metric reading: the label exactly as shown, the value, its window, any slice and comparison. Point it at a canonical metric id.</li>
      <li>If no canonical metric fits, add one to <span class="mono">framework/metric_registry.json</span> with a definition, formula, grain, unit and Skio fields. Do the same for new dimensions, concepts or chart patterns.</li>
      <li>Copy each chart's data arrays from the page source into the chart block. Copy tables row by row.</li>
      <li>Recompute headline figures from the report's own inputs. Log every mismatch, bias or misleading chart as a QA flag with evidence ids.</li>
      <li>Add store links, definition differences and shared themes to <span class="mono">crosscheck.json</span>.</li>
      <li>Run the build. It refuses to write if any id, dimension, concept or pattern is unknown, or a chart series length does not match its labels.</li></ol></div>
    <div class="block"><h2>Build command</h2><pre class="pre">python tools/build.py --catalog &lt;private catalog dir&gt; --out &lt;out dir&gt; --html</pre></div>
    <div class="block"><h2>Output</h2><div class="tw"><table><thead><tr><th>File</th><th>Use</th></tr></thead><tbody>
      <tr><td class="mono">bundle.json</td><td>Framework, reports, matrices and QA in one file. The source for the final visualisation.</td></tr>
      <tr><td class="mono">csv/metric_instances.csv</td><td>Every metric reading, one row each, with canonical id and domain.</td></tr>
      <tr><td class="mono">csv/charts.csv, csv/tables.csv</td><td>Chart encodings with data, and full tables.</td></tr>
      <tr><td class="mono">csv/metric_coverage.csv</td><td>Canonical metric by report matrix.</td></tr>
      <tr><td class="mono">csv/qa_flags.csv</td><td>The data-quality ledger.</td></tr>
      <tr><td class="mono">csv/skio_native_coverage.csv</td><td>Every Skio export field and whether any source uses it.</td></tr></tbody></table></div></div>
    <p class="note">The populated catalogue holds client figures and is kept out of the public repository. Only the framework, template and tools are committed.</p>`;
}
};

function qaTable(list, showReport){
  if (!list.length) return '<p class="muted">No flags.</p>';
  return `<div class="tw"><table><thead><tr><th>ID</th>${showReport ? '<th>Reports</th>' : ''}<th>Severity</th><th>Type</th><th>Finding</th></tr></thead><tbody>${list.map(f => `<tr><td class="mono">${f.id}</td>${showReport ? `<td class="mono">${esc(f.report)}</td>` : ''}<td>${sev(f.severity)}</td><td>${esc(f.type.replace(/_/g, ' '))}</td><td class="wrap">${esc(f.detail)}${f.evidence && f.evidence.length ? `<div class="mono muted">${f.evidence.join(', ')}</div>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}

function metricRow(m){
  const refs = B.matrices.metric[m.id] || {};
  const inst = R.flatMap(r => r.metrics.filter(x => x.metric_id === m.id).map(x => ({r: r.report_id, x})));
  const readings = inst.length ? `<div class="tw"><table><thead><tr><th>Report</th><th>Label as shown</th><th class="num">Value</th><th>Window</th><th>Slice</th></tr></thead><tbody>${inst.map(({r, x}) => `<tr><td>${rchip(r)}</td><td>${esc(x.label)}</td><td class="num">${fmt(x.value, x.unit)}</td><td>${esc(x.window)}</td><td>${sliceTxt(x.slice)}</td></tr>`).join('')}</tbody></table></div>` : '';
  const other = Object.entries(refs).map(([r, ids]) => ids.filter(i => !/-M\d/.test(i)).length ? `${r}: ${ids.filter(i => !/-M\d/.test(i)).join(', ')}` : '').filter(Boolean);
  return `<details id="m-${m.id}"><summary><b>${esc(m.name)}</b> <span class="mono muted">${m.id}</span> <span class="chip">${m.domain}</span> ${Object.keys(refs).map(r => `<span class="chip acc">${r}</span>`).join(' ')}</summary><div style="padding:12px;display:flex;flex-direction:column;gap:10px">
    <dl class="kv"><dt>Definition</dt><dd>${esc(m.definition)}</dd><dt>Formula</dt><dd class="mono">${esc(m.formula)}</dd><dt>Unit · grain</dt><dd>${esc(m.unit)} · ${esc(m.grain)}</dd><dt>Better when</dt><dd>${m.polarity === 'up_good' ? 'higher' : m.polarity === 'down_good' ? 'lower' : 'neutral'}</dd><dt>Skio fields</dt><dd>${m.skio.map(f => `<span class="chip">${esc(f)}</span>`).join(' ') || '—'}</dd><dt>Labels seen</dt><dd>${m.aliases.map(esc).join('; ') || '—'}</dd>${other.length ? `<dt>Also in</dt><dd class="mono">${other.map(esc).join('<br>')}</dd>` : ''}</dl>${readings}</div></details>`;
}

function bind(id){
  if (id === 'reports') main.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => show(b.dataset.pick));
  if (id === 'reports') main.querySelectorAll('[data-metric]').forEach(b => b.onclick = () => { show('metrics'); const d = document.getElementById('m-' + b.dataset.metric); if (d) { d.open = true; d.scrollIntoView(); } });
  if (id === 'metrics'){
    const q = document.getElementById('mq'), d = document.getElementById('md'), u = document.getElementById('mu'), out = document.getElementById('mlist'), cnt = document.getElementById('mcount');
    const run = () => { const s = q.value.toLowerCase().trim();
      const list = F.metrics.filter(m => { const n = Object.keys(B.matrices.metric[m.id] || {}).length;
        return (!d.value || m.domain === d.value) && (!u.value || (u.value === 'used' ? n > 0 : u.value === 'unused' ? n === 0 : n >= 2)) &&
          (!s || (m.id + ' ' + m.name + ' ' + m.aliases.join(' ') + ' ' + m.definition).toLowerCase().includes(s)); });
      cnt.textContent = list.length + ' shown';
      out.innerHTML = F.taxonomy.domains.map(dd => { const ms = list.filter(m => m.domain === dd.id); return ms.length ? `<div class="block"><h3>${dd.id} · ${esc(dd.name)} <span class="muted" style="font-weight:400">${esc(dd.question)}</span></h3>${ms.map(metricRow).join('')}</div>` : ''; }).join('') || '<p class="muted">No metric matches. Clear the search or pick another domain.</p>'; };
    [q, d, u].forEach(e => e.oninput = run); run();
  }
  if (id === 'charts'){
    const r = document.getElementById('cr'), p = document.getElementById('cp'), out = document.getElementById('clist'), cnt = document.getElementById('ccount');
    const run = () => { const cs = R.flatMap(x => x.charts.map(c => ({c, r: x.report_id}))).filter(o => (!r.value || o.r === r.value) && (!p.value || o.c.pattern === p.value));
      cnt.textContent = cs.length + ' charts'; out.innerHTML = cs.map(o => chartCard(o.c, o.r)).join('') || '<p class="muted">No chart matches this filter.</p>'; };
    [r, p].forEach(e => e.oninput = run); run();
  }
  if (id === 'quality'){
    let s = ''; const t = document.getElementById('qt'), r = document.getElementById('qr'), out = document.getElementById('qlist');
    const run = () => out.innerHTML = qaTable(B.qa.filter(f => (!s || f.severity === s) && (!t.value || f.type === t.value) && (!r.value || (r.value === 'X' ? f.id.startsWith('X-') : String(f.report).split('+').includes(r.value)))), true);
    document.querySelectorAll('#qs button').forEach(b => b.onclick = () => { s = b.dataset.s; document.querySelectorAll('#qs button').forEach(x => x.setAttribute('aria-pressed', x === b)); run(); });
    [t, r].forEach(e => e.oninput = run); run();
  }
}
let lastHash = '';
function fromHash(){ const h = (location.hash || '').slice(1); if (h === lastHash) return; lastHash = h; show(h || 'overview'); }
addEventListener('hashchange', fromHash);
fromHash();
</script>
